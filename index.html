<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAMPUS 360 - Centralized Smart Campus Portal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase App & Realtime Database CDN scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col md:flex-row overflow-x-hidden">

  <!-- Mobile Header Toggle -->
  <div class="md:hidden flex items-center justify-between bg-slate-900 px-4 py-3 border-b border-slate-800 w-full fixed top-0 left-0 z-50">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-graduation-cap text-indigo-400 text-xl"></i>
      <span class="font-bold text-lg tracking-wider">CAMPUS 360</span>
    </div>
    <button id="menu-btn" class="text-slate-300 focus:outline-none text-2xl">
      <i class="fa-solid fa-bars"></i>
    </button>
  </div>

  <!-- Left Sidebar Navigation -->
  <aside id="sidebar" class="bg-slate-900 border-r border-slate-800 w-64 fixed md:static inset-y-0 left-0 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out z-40 flex flex-col justify-between pt-16 md:pt-0">
    <div>
      <!-- Logo Area -->
      <div class="hidden md:flex items-center space-x-3 px-6 py-6 border-b border-slate-800">
        <i class="fa-solid fa-graduation-cap text-indigo-400 text-2xl"></i>
        <span class="font-bold text-xl tracking-wider">CAMPUS 360</span>
      </div>

      <!-- Navigation Links -->
      <nav class="px-4 py-6 space-y-2">
        <a href="#home" class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-indigo-600 text-white font-medium shadow-lg shadow-indigo-600/30 transition-all">
          <i class="fa-solid fa-house w-5"></i>
          <span>Home</span>
        </a>
        <a href="#grievance" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white transition-all">
          <i class="fa-solid fa-bullhorn w-5 text-amber-400"></i>
          <span>Grievance</span>
        </a>
        <a href="#sos" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white transition-all">
          <i class="fa-solid fa-shield-halved w-5 text-rose-500"></i>
          <span>SOS</span>
        </a>
        <a href="#outpass" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white transition-all">
          <i class="fa-solid fa-id-card w-5 text-sky-400"></i>
          <span>Out-Pass</span>
        </a>
        <a href="#lostfound" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white transition-all">
          <i class="fa-solid fa-magnifying-glass w-5 text-emerald-400"></i>
          <span>Lost & Found</span>
        </a>
        <a href="#parent" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white transition-all">
          <i class="fa-solid fa-users w-5 text-purple-400"></i>
          <span>Parent</span>
        </a>
        <a href="#admin" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white transition-all">
          <i class="fa-solid fa-lock w-5 text-slate-400"></i>
          <span>Admin</span>
        </a>
      </nav>
    </div>

    <div class="px-6 py-4 border-t border-slate-800 text-xs text-slate-500">
      &copy; 2026 Campus 360 System
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col mt-14 md:mt-0 p-6 md:p-12 overflow-y-auto">
    <div class="max-w-4xl mx-auto w-full space-y-8">
      
      <!-- Hero Section -->
      <div class="bg-gradient-to-br from-slate-900 to-slate-900/40 border border-slate-800 rounded-3xl p-8 md:p-12 shadow-2xl relative overflow-hidden">
        <div class="absolute -right-10 -bottom-10 opacity-10 text-9xl">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-4 bg-gradient-to-r from-indigo-400 via-purple-300 to-white bg-clip-text text-transparent">
          Centralized Smart Campus Portal
        </h1>
        <p class="text-slate-400 text-lg md:text-xl max-w-2xl leading-relaxed">
          Manage campus grievances, emergency SOS, out-passes, and lost items seamlessly across devices with real-time cloud synchronization.
        </p>
        <div class="mt-8 flex flex-wrap gap-4">
          <button onclick="playWelcomeVoice()" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex items-center space-x-2">
            <i class="fa-solid fa-volume-high"></i>
            <span>Play Welcome Audio</span>
          </button>
        </div>
      </div>

    </div>
  </main>

  <!-- JavaScript for Sidebar Toggle & Welcome Audio -->
  <script>
    // Mobile Sidebar Toggle Logic
    const menuBtn = document.getElementById('menu-btn');
    const sidebar = document.getElementById('sidebar');

    menuBtn.addEventListener('click', () => {
      sidebar.classList.toggle('-translate-x-full');
    });

    // Welcome Voice Function using Web Speech API
    function playWelcomeVoice() {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance("Welcome to Campus 360");
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        utterance.volume = 1.0;
        window.speechSynthesis.speak(utterance);
      } else {
        console.log("Speech synthesis not supported in this browser.");
      }
    }

    // Automatically speak when page loads (User interaction may be required by browsers)
    window.addEventListener('load', () => {
      setTimeout(playWelcomeVoice, 1000);
    });
  </script>
</body>
</html>
